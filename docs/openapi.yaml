                  type: object
                  additionalProperties: true
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    $ref: '#/components/schemas/Task'

  /api/tasks/{taskId}:
    get:
      tags: [Tasks]
      summary: Get task
      description: Get details of a specific task
      parameters:
