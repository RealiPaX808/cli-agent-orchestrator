    put:
      tags: [Tasks]
      summary: Update task status
      description: Update the status of a task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  $ref: '#/components/schemas/TaskStatus'
                result:
                  type: object
                  additionalProperties: true
                error:
                  type: string
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    $ref: '#/components/schemas/Task'

  /api/tasks/{taskId}/assign:
    post:
      tags: [Tasks]
      summary: Assign task
      description: Assign a task to an agent
      parameters:
        - name: taskId
          in: path
