                  type: string

  /api/agents/{agentName}/content:
    get:
      tags: [Agents]
      summary: Get agent content
      description: Get the content of an agent profile
      parameters:
        - name: agentName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agent content
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: string

  /api/agents/install:
    post:
      tags: [Agents]
      summary: Install agent
      description: Install a new agent profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - source_type
                - provider
              properties:
                source_type:
                  type: string
                  enum: [built-in, file, url]
                name:
                  type: string
                path:
                  type: string
                provider:
                  $ref: '#/components/schemas/ProviderType'
      responses:
        '200':
          description: Agent installed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
