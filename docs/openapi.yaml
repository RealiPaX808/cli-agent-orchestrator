openapi: 3.1.0
info:
  title: CLI Agent Orchestrator API
  version: 1.0.0
  description: |
    REST API for the CLI Agent Orchestrator (CAO) - a workflow-based agent
    coordination system for managing multiple AI agent terminals and workflows.

  contact:
    name: API Support
    email: support@cli-agent-orchestrator.io

  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:9889
    description: Development server
  - url: https://api.cli-agent-orchestrator.io
    description: Production server

tags:
  - name: Authentication
    description: User authentication and token management
  - name: Sessions
    description: Session management for agent coordination
  - name: Workflows
    description: Workflow definition and management
  - name: Executions
    description: Workflow execution management
  - name: Terminals
    description: Terminal agent management
  - name: Tasks
    description: Task assignment and tracking
  - name: Webhooks
    description: Webhook configuration and management
  - name: Events
    description: Event history and auditing
  - name: Metrics
    description: System metrics and analytics
  - name: Agents
    description: Agent profile management

security:
  - BearerAuth: []
  - ApiKeyAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /api/auth/login
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for service-to-service authentication

  schemas:
    # Error Response
    Error:
      type: object
      required:
        - error
        - code
        - timestamp
        - requestId
      properties:
        error:
          type: string
          description: Human-readable error message
        code:
          type: string
          description: Machine-readable error code
          enum:
            - AUTH_FAILED
            - AUTHZ_FAILED
            - TOKEN_EXPIRED
            - VALIDATION_ERROR
            - WORKFLOW_NOT_FOUND
            - SESSION_NOT_FOUND
            - TERMINAL_NOT_FOUND
            - EXECUTION_NOT_FOUND
            - TASK_NOT_FOUND
            - EXECUTION_FAILED
            - RATE_LIMITED
            - INTERNAL_ERROR
        details:
          type: object
          additionalProperties: true
          description: Additional error details
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string
          description: Unique request identifier for tracing

    # Pagination
    PaginationParams:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          default: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        sortBy:
          type: string
        sortOrder:
          type: string
          enum: [asc, desc]
          default: desc

    PaginatedResponse:
      type: object
      required:
        - data
        - total
        - page
        - limit
        - hasNext
        - hasPrevious
      properties:
        data:
          type: array
          items: true
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
        hasNext:
          type: boolean
        hasPrevious:
          type: boolean

    # Enums
    TerminalStatus:
      type: string
      enum:
        - idle
        - processing
        - completed
        - waiting_permission
        - waiting_user_answer
        - error

    ProviderType:
      type: string
      enum:
        - q_cli
        - kiro_cli
        - claude_code
        - opencode
        - gemini_cli
        - qwen_cli
        - gh_copilot

    SessionStatus:
      type: string
      enum:
        - active
        - detached
        - terminated

    WorkflowExecutionStatus:
      type: string
      enum:
        - idle
        - running
        - paused
        - completed
        - failed

    BPMNElementType:
      type: string
      enum:
        - startEvent
        - endEvent
        - serviceTask
        - scriptTask
        - userTask
        - exclusiveGateway
        - parallelGateway
        - inclusiveGateway
        - sequenceFlow
        - agent_spawn
        - handoff
        - assign
        - send_message
        - webhook
        - xor_split
        - xor_join
        - and_split
        - and_join
        - or_split
        - or_join
        - decision
        - input
        - output

    TaskStatus:
      type: string
      enum:
        - pending
        - assigned
        - in_progress
        - completed
        - failed
        - cancelled

    TaskPriority:
      type: string
      enum:
        - low
        - medium
        - high
        - critical

    EventType:
      type: string
      enum:
        - workflow.created
        - workflow.updated
        - workflow.deleted
        - workflow.execution.started
        - workflow.execution.completed
        - workflow.execution.failed
        - workflow.execution.paused
        - workflow.execution.resumed
        - node.execution.started
        - node.execution.completed
        - node.execution.failed
        - node.skipped
        - agent.spawned
        - agent.terminated
        - agent.assigned
        - agent.message_sent
        - agent.message_received
        - session.created
        - session.deleted
        - session.attached
        - session.detached
        - terminal.created
        - terminal.deleted
        - terminal.status_changed
        - terminal.output
        - task.created
        - task.assigned
        - task.started
        - task.completed
        - task.failed

    # Core Entities
    Terminal:
      type: object
      required:
        - id
        - provider
        - session_name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        provider:
          $ref: '#/components/schemas/ProviderType'
        session_name:
          type: string
        agent_profile:
          type: string
        status:
          $ref: '#/components/schemas/TerminalStatus'
        last_active:
          type: string
          format: date-time

    Session:
      type: object
      required:
        - id
        - name
        - status
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          $ref: '#/components/schemas/SessionStatus'
        workflow_id:
          type: string
          format: uuid
        execution_state:
          type: object
          additionalProperties: true
        terminals:
          type: array
          items:
            $ref: '#/components/schemas/Terminal'

    WorkflowConfig:
      type: object
      properties:
        autoExecute:
          type: boolean
          default: false
        parallelExecution:
          type: boolean
          default: false
        maxParallelNodes:
          type: integer
          minimum: 1
          maximum: 100
        errorHandling:
          type: string
          enum: [stop, continue, retry]
          default: stop

    WorkflowNode:
      type: object
      required:
        - id
        - type
        - label
        - position
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/BPMNElementType'
        label:
          type: string
        position:
          type: object
          properties:
            x:
              type: number
            y:
              type: number
        data:
          type: object
          properties:
            id:
              type: string
            type:
              $ref: '#/components/schemas/BPMNElementType'
            label:
              type: string
            config:
              type: object
              additionalProperties: true
            status:
              $ref: '#/components/schemas/WorkflowExecutionStatus'
            terminalId:
              type: string
            output:
              type: string

    WorkflowEdge:
      type: object
      required:
        - id
        - source
        - target
      properties:
        id:
          type: string
        source:
          type: string
        target:
          type: string
        label:
          type: string
        conditionExpression:
          type: string

    Workflow:
      type: object
      required:
        - id
        - name
        - nodes
        - edges
        - config
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowEdge'
        config:
          $ref: '#/components/schemas/WorkflowConfig'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer

    WorkflowExecution:
      type: object
      required:
        - workflowId
        - executionId
        - status
      properties:
        workflowId:
          type: string
          format: uuid
        executionId:
          type: string
        status:
          $ref: '#/components/schemas/WorkflowExecutionStatus'
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        nodes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/WorkflowNodeExecution'
        currentNodeId:
          type: string
        error:
          type: string

    WorkflowNodeExecution:
      type: object
      required:
        - nodeId
        - status
      properties:
        nodeId:
          type: string
        status:
          $ref: '#/components/schemas/WorkflowExecutionStatus'
        terminalId:
          type: string
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        output:
          type: string
        error:
          type: string

    Task:
      type: object
      required:
        - id
        - workflowId
        - executionId
        - nodeId
        - status
        - priority
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        workflowId:
          type: string
          format: uuid
        executionId:
          type: string
        nodeId:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        assignedTo:
          type: string
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        error:
          type: string
        result:
          type: object
          additionalProperties: true
        input:
          type: object
          additionalProperties: true

    Webhook:
      type: object
      required:
        - id
        - name
        - url
        - method
        - enabled
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        url:
          type: string
          format: uri
        method:
          type: string
          enum: [GET, POST, PUT, DELETE]
        headers:
          type: object
          additionalProperties:
            type: string
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastTriggeredAt:
          type: string
          format: date-time

    Event:
      type: object
      required:
        - id
        - type
        - timestamp
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/EventType'
        timestamp:
          type: string
          format: date-time
        correlationId:
          type: string
          format: uuid
        causationId:
          type: string
        data:
          type: object
          additionalProperties: true

    # Auth
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
        - user
      properties:
        access_token:
          type: string
        token_type:
          type: string
          default: Bearer
        expires_in:
          type: integer
        refresh_token:
          type: string
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            username:
              type: string
            email:
              type: string
              format: email
            roles:
              type: array
              items:
                type: string
            createdAt:
              type: string
              format: date-time

    User:
      type: object
      required:
        - id
        - username
        - email
        - roles
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            type: string
            enum: [admin, operator, viewer]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

paths:
  # ========================================================================
  # Authentication
  # ========================================================================
  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Login user
      description: Authenticate with username/password and receive JWT token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh access token
      description: Get a new access token using refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                  expires_in:
                    type: integer

  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: Logout user
      description: Invalidate the current session
      responses:
        '200':
          description: Successful logout
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /api/auth/me:
    get:
      tags: [Authentication]
      summary: Get current user
      description: Get information about the authenticated user
      responses:
        '200':
          description: User information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  # ========================================================================
  # Sessions
  # ========================================================================
  /api/sessions:
    get:
      tags: [Sessions]
      summary: List sessions
      description: Get all sessions with optional filtering
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/StatusFilter'
      responses:
        '200':
          description: List of sessions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Session'

    post:
      tags: [Sessions]
      summary: Create session
      description: Create a new session with an agent terminal
      parameters:
        - name: provider
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ProviderType'
        - name: agent_profile
          in: query
          required: true
          schema:
            type: string
        - name: session_name
          in: query
          schema:
            type: string
        - name: workflow_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Terminal'

  /api/sessions/{name}:
    get:
      tags: [Sessions]
      summary: Get session
      description: Get details of a specific session
      parameters:
        - $ref: '#/components/parameters/SessionName'
      responses:
        '200':
          description: Session details
          content:
            application/json:
              schema:
                type: object
                properties:
                  session:
                    $ref: '#/components/schemas/Session'
                  terminals:
                    type: array
                    items:
                      $ref: '#/components/schemas/Terminal'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Sessions]
      summary: Delete session
      description: Delete a session and all its terminals
      parameters:
        - $ref: '#/components/parameters/SessionName'
      responses:
        '200':
          description: Session deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /api/sessions/{name}/workflow:
    get:
      tags: [Sessions]
      summary: Get session workflow
      description: Get the workflow associated with a session
      parameters:
        - $ref: '#/components/parameters/SessionName'
      responses:
        '200':
          description: Workflow details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'

  /api/sessions/{name}/terminals:
    get:
      tags: [Sessions]
      summary: List session terminals
      description: Get all terminals for a session
      parameters:
        - $ref: '#/components/parameters/SessionName'
      responses:
        '200':
          description: List of terminals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Terminal'

  # ========================================================================
  # Workflows
  # ========================================================================
  /api/workflows:
    get:
      tags: [Workflows]
      summary: List workflows
      description: Get all workflows with pagination
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: List of workflows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workflow'

    post:
      tags: [Workflows]
      summary: Create workflow
      description: Create a new workflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Workflow'
      responses:
        '201':
          description: Workflow created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'

  /api/workflows/{id}:
    get:
      tags: [Workflows]
      summary: Get workflow
      description: Get details of a specific workflow
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
      responses:
        '200':
          description: Workflow details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'

    put:
      tags: [Workflows]
      summary: Update workflow
      description: Update an existing workflow
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                nodes:
                  type: array
                  items:
                    $ref: '#/components/schemas/WorkflowNode'
                edges:
                  type: array
                  items:
                    $ref: '#/components/schemas/WorkflowEdge'
                config:
                  $ref: '#/components/schemas/WorkflowConfig'
      responses:
        '200':
          description: Workflow updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

    delete:
      tags: [Workflows]
      summary: Delete workflow
      description: Delete a workflow
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
      responses:
        '200':
          description: Workflow deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /api/workflows/{id}/execute:
    post:
      tags: [Executions]
      summary: Execute workflow
      description: Start a new workflow execution
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                input:
                  type: object
                  additionalProperties: true
                config:
                  $ref: '#/components/schemas/WorkflowConfig'
      responses:
        '201':
          description: Execution started
          content:
            application/json:
              schema:
                type: object
                properties:
                  executionId:
                    type: string
                  workflowId:
                    type: string
                    format: uuid
                  status:
                    $ref: '#/components/schemas/WorkflowExecutionStatus'
                  startedAt:
                    type: string
                    format: date-time

  /api/workflows/{id}/executions:
    get:
      tags: [Executions]
      summary: List workflow executions
      description: Get all executions for a workflow
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/WorkflowExecutionStatus'
      responses:
        '200':
          description: List of executions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'

  # ========================================================================
  # Executions
  # ========================================================================
  /api/executions/{executionId}:
    get:
      tags: [Executions]
      summary: Get execution
      description: Get details of a specific execution
      parameters:
        - name: executionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Execution details
          content:
            application/json:
              schema:
                type: object
                properties:
                  execution:
                    $ref: '#/components/schemas/WorkflowExecution'
                  workflow:
                    $ref: '#/components/schemas/Workflow'

  /api/executions/{executionId}/pause:
    post:
      tags: [Executions]
      summary: Pause execution
      description: Pause a running execution
      parameters:
        - name: executionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Execution paused
          content:
            application/json:
              schema:
                type: object
                properties:
                  executionId:
                    type: string
                  status:
                    type: string
                    enum: [paused]

  /api/executions/{executionId}/resume:
    post:
      tags: [Executions]
      summary: Resume execution
      description: Resume a paused execution
      parameters:
        - name: executionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Execution resumed
          content:
            application/json:
              schema:
                type: object
                properties:
                  executionId:
                    type: string
                  status:
                    type: string
                    enum: [running]

  /api/executions/{executionId}/cancel:
    post:
      tags: [Executions]
      summary: Cancel execution
      description: Cancel an execution
      parameters:
        - name: executionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Execution cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  executionId:
                    type: string
                  status:
                    type: string
                    enum: [cancelled]
                  reason:
                    type: string

  # ========================================================================
  # Terminals
  # ========================================================================
  /api/terminals/{id}:
    get:
      tags: [Terminals]
      summary: Get terminal
      description: Get details of a specific terminal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Terminal details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Terminal'

    delete:
      tags: [Terminals]
      summary: Delete terminal
      description: Delete a terminal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Terminal deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /api/terminals/{id}/output:
    get:
      tags: [Terminals]
      summary: Get terminal output
      description: Get the output from a terminal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: mode
          in: query
          schema:
            type: string
            enum: [full, last, stream]
