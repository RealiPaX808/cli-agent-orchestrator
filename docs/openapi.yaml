                headers:
                  type: object
                  additionalProperties:
                    type: string
                enabled:
                  type: boolean
                  default: true
      responses:
        '201':
          description: Webhook created
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhook:
                    $ref: '#/components/schemas/Webhook'

  /api/webhooks/{id}:
    put:
      tags: [Webhooks]
      summary: Update webhook
      description: Update an existing webhook
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                url:
                  type: string
                  format: uri
                method:
                  type: string
                  enum: [GET, POST, PUT, DELETE]
                headers:
                  type: object
                  additionalProperties:
                    type: string
                enabled:
                  type: boolean
      responses:
        '200':
          description: Webhook updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhook:
                    $ref: '#/components/schemas/Webhook'

    delete:
      tags: [Webhooks]
      summary: Delete webhook
