          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Webhook deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /api/webhooks/execute:
    post:
      tags: [Webhooks]
      summary: Execute webhook
      description: Execute a webhook immediately
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - webhookUrl
                - method
              properties:
                webhookUrl:
                  type: string
                  format: uri
                method:
                  type: string
                  enum: [GET, POST, PUT, DELETE]
                payload:
                  type: string
                headers:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        '200':
          description: Webhook executed
