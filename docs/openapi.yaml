                    type: string

  /api/providers:
    get:
      tags: [Agents]
      summary: List providers
      description: Get all available providers
      responses:
        '200':
          description: List of providers
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    value:
                      type: string
                    label:
                      type: string

  # ========================================================================
  # WebSocket
  # ========================================================================
  /ws:
    get:
      tags: [WebSocket]
      summary: WebSocket connection
      description: |
        Establish a WebSocket connection for real-time updates.

        Subscribe to channels using subscribe message:
        ```json
        {
          "type": "subscribe",
          "id": "sub-001",
          "timestamp": "2025-01-11T10:00:00Z",
          "payload": {
            "channels": ["sessions:*", "workflows:{id}"]
          }
        }
        ```

        Channel format: `{resource}:{action}:{identifier}`
        - sessions:* - All session events
        - sessions:{sessionId} - Events for specific session
        - workflows:{workflowId} - Events for specific workflow
        - executions:{executionId} - Events for specific execution
        - terminals:{terminalId} - Output for specific terminal
      parameters:
        - name: token
          in: query
          required: true
          description: JWT authentication token
          schema:
            type: string
      responses:
        '101':
          description: Switching protocols - WebSocket established
      callbacks:
        # WebSocket message callbacks
        onMessage:
          { "$ref": '#/components/callbacks/MessageEvent' }

components:
  parameters:
    Page:
      name: page
      in: query
      description: Page number for pagination
      schema:
        type: integer
        minimum: 1
        default: 1

    Limit:
      name: limit
      in: query
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    Search:
      name: search
      in: query
      description: Search term
      schema:
        type: string

    StatusFilter:
      name: status
      in: query
      description: Filter by status
      schema:
        type: string

    SessionName:
      name: name
      in: path
      required: true
      description: Session name
      schema:
        type: string

    WorkflowId:
      name: id
      in: path
      required: true
      description: Workflow ID (UUID)
      schema:
        type: string
        format: uuid

  callbacks:
    MessageEvent:
      { "$ref": "#/components/schemas/WebSocketMessage" }

  schemas:
    WebSocketMessage:
      type: object
      required:
        - type
        - id
        - timestamp
      properties:
        type:
          type: string
          enum: [subscribe, unsubscribe, ack, event, heartbeat, error, pong]
        id:
          type: string
        timestamp:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
